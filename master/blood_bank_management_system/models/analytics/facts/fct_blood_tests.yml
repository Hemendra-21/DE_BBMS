version: 2

models:
  - name: fct_blood_tests
    description: Fact table storing results of blood tests conducted on donors.

    columns:

      - name: blood_test_id
        description: Unique identifier for each blood test.
        tests:
          - unique
          - not_null

      - name: donation_id
        description: Links blood test to donation.
        tests:
          - not_null
          - relationships:
              to: ref('fct_blood_donations')
              field: donation_id

      - name: donor_id
        description: Key referencing dim_donor.
        tests:
          - not_null
          - relationships:
              to: ref('dim_donor')
              field: donor_id

      - name: blood_test_date_id
        description: Date key referencing dim_date.
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_id

      - name: blood_test_type
        description: Type of blood test conducted.
        tests:
          - not_null

      - name: blood_test_result
        description: Result of the blood test.
        tests:
          - accepted_values:
              values:
                - Positive
                - Negative
                - Low
                - Normal
                - Healthy
                - A+
                - A-
                - B+
                - B-
                - O+
                - O-
                - AB+
                - AB-

      - name: ingested_at
        description: Timestamp when record was ingested into staging.
        tests:
          - not_null