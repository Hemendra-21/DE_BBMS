version: 2

models:
  - name: dim_donor
    description: "A dimension table that contains information about donors."
    columns:
      - name: donor_id 
        description: "Natural key for the donor, typically an ID from the source system."
        tests:
          - not_null

      - name: donor_name
        description: "The name of the donor."
        tests:
          - not_null

      - name: donor_age
        description: "The age of the donor."
        tests:
          - not_null

      - name: donor_gender
        description: "The gender of the donor."
        tests:
          - not_null
          
      - name: donor_blood_group
        description: "The blood group of the donor."
        tests:
          - not_null 
        
      - name: is_eligible
        description: "Indicates whether the donor is eligible to donate blood."
        tests:
          - not_null
      
      - name: donor_city
        description: "The city where the donor resides."
        tests:
          - not_null
          
      - name: donor_state
        description: "The state where the donor resides."
        tests:
          - not_null

      - name: last_donation_date
        description: "The most recent donation date recorded for the donor."

          
