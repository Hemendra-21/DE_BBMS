version: 2

models:
  - name: stg_recipients
    description: "Standardized staging model for blood recipients (dimension table)"

    columns:

      - name: recipient_id
        description: "Primary key for recipient"
        tests:
          - not_null
          - unique

      - name: name
        description: "Full name of recipient"
        tests:
          - not_null

      - name: age
        description: "Age of recipient"
        tests:
          - not_null

      - name: blood_group
        description: "Blood group of recipient"
        tests:
          - not_null
          - accepted_values:
              values: ['A+', 'A-', 'B+', 'B-', 'O+', 'O-', 'AB+', 'AB-']

      - name: city
        description: "City of residence for recipient"
        tests:
          - not_null
      
      - name: state
        description: "State of residence for recipient"
        tests:
          - not_null