version: 2 

models:
  - name: fct_blood_donations
    description: Fact table capturing blood donation events.

    columns:

      - name: donation_id 
        description: Unique identifier for each donation event.
        tests:
          - unique
          - not_null

      - name: donor_id
        description: Key referencing dim_donor.
        tests:
          - not_null
          - relationships:
              to: ref('dim_donor') 
              field: donor_id

      - name: hospital_id
        description: Key referencing dim_hospital.
        tests:
          - not_null
          - relationships:
              to: ref('dim_hospital')
              field: hospital_id

      - name: recipient_id
        description: Key referencing dim_recipient (only for distributed donations).
        tests:
          - relationships:
              to: ref('dim_recipient')
              field: recipient_id
              where: "recipient_id is not null"

      - name: donation_date_id
        description: Date key referencing dim_date.
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_id

      - name: donation_status
        description: Status of donation lifecycle.
        tests:
          - not_null
          - accepted_values:
              values: ['collected', 'tested', 'completed', 'distributed', 'discarded']

      - name: donated_volume_ml
        description: Quantity of blood collected in ml.
        tests:
          - not_null

      - name: ingested_at
        description: Timestamp when record was ingested.
        tests:
          - not_null