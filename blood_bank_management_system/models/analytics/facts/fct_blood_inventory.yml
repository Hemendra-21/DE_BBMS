version: 2 

models:
  - name: fct_blood_inventory
    description: "Fact table for blood inventory storing One row per inventory record per donation"
    columns:
      - name: inventory_id
        description: "Unique identifier for each inventory record."
        tests:
          - unique
          - not_null

      - name: donation_id
        description: "Foreign key referencing the donation associated with this inventory record."
        tests:
          - not_null
          - relationships:
              to: ref('fct_donations')
              field: donation_id

      - name: blood_group
        description: "Blood group of the inventory item."
        tests:
          - not_null

      - name: received_date_sk
        description: "Surrogate key referencing the date the blood was received."
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: received_date_sk

      - name: expiration_date_sk
        description: "Surrogate key referencing the expiration date of the blood."
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: expiration_date_sk

      - name: units_available
        description: "Number of units available in the inventory."
        tests:
          - not_null

      - name: volume
        description: "Volume of blood in the inventory."
        tests:
          - not_null

      - name: quality
        description: "Quality status of the blood inventory."
        tests:
          - not_null

      - name: status
        description: "Current status of the blood inventory (e.g., available, used, expired)."
        tests:
          - not_null
