version: 2 

models: 
  - name: fct_blood_requests
    description: "Fact table storing one row per blood request event. 
                  This table is used to analyze blood request patterns and trends."
    columns:
      - name: blood_request_sk
        description: "Surrogate key for the blood request event."
        tests:
          - unique
          - not_null

      - name: recipient_sk
        description: "Surrogate key for the recipient of the blood request referencing dim_recipient."
        tests:
          - not_null
          - relationships:
              to: ref('dim_recipient')
              field: recipient_sk

      - name: hospital_sk
        description: "Surrogate key for the hospital where the blood request was made referencing dim_hospital."
        tests:
          # - not_null
          - relationships:
              to: ref('dim_hospital')
              field: hospital_sk

      - name: blood_required_date_sk 
        description: "Surrogate key for the date when the blood is required referencing dim_date."
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_sk

      - name: urgency
        description: "Urgency level of the blood request."
        tests:
          - not_null
