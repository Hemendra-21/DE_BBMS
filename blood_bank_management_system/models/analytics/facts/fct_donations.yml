version: 2 

models:
  - name: fct_donations 
    description: "Fact table storing one row per blood donation event"

    columns:

      - name: donation_id
        description: "Business key for the donation event, unique identifier for each donation."
        tests:
          - unique
          - not_null

      - name: donor_sk
        description: "Surrogate key referencing the dim_donor dimension."
        tests:
          - not_null
          - relationships:
              to: ref('dim_donor')
              field: donor_sk
      
      - name: hospital_sk
        description: "Surrogate key referencing the dim_hospital dimension."
        tests:
          - relationships:
              to: ref('dim_hospital')
              field: hospital_sk
      
      - name: recipient_sk
        description: "Surrogate key referencing the dim_recipient dimension."
        tests:
          - relationships:
              to: ref('dim_recipient')
              field: recipient_sk

      - name: donation_date_sk
        description: "Surrogate key referencing the dim_date dimension for the date of donation."
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_sk
      
      - name: quantity
        description: "Units of blood donated in this event."
        tests:
          - not_null
          # - dbt_utils.expression_is_true:
          #     expression: "quantity > 0"
          
      - name: donation_status
        description: "Status of the donation (e.g., successful, deferred, etc.)."
        tests:
          - not_null
          # - accepted_values:
          #     values: ['pending', 'complete', 'tested', 'distributed']
