version: 2 

models:
  - name: fct_donations
    description: Fact table capturing blood donation events.
    columns:
      - name: donation_id 
        description: Unique identifier for each donation event.
        tests:
          - unique
          - not_null

      - name: donor_sk 
        description: Surrogate key referencing dim_donor.
        tests:
          - not_null
          - relationships:
              to: ref('dim_donor') 
              field: donor_sk

      - name: hospital_sk 
        description: Surrogate key referencing dim_hospital.
        tests:
          # - not_null
          - relationships:
              to: ref('dim_hospital')
              field: hospital_sk

      - name: recipient_sk 
        description: Surrogate key referencing dim_recipient.
        tests:
          # - not_null
          - relationships:
              to: ref('dim_recipient')
              field: recipient_sk

      - name: donation_date_sk
        description: Date surrogate key referencing dim_date.
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_sk