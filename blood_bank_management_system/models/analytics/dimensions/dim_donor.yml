version: 2

models:
  - name: dim_donor
    description: "A dimension table that contains information about donors."
    columns:
      - name: donor_sk
        description: "Surrogate key for the donor dimension."
        tests:
          - unique
          - not_null

      - name: donor_id 
        description: "Natural key for the donor, typically an ID from the source system."
        tests:
          - not_null

      - name: donor_name
        description: "The name of the donor."
        tests:
          - not_null

      - name: donor_gender
        description: "The gender of the donor."
        tests:
          - not_null
          
      - name: donor_blood_group
        description: "The blood group of the donor."
        tests:
          - not_null 
        
      - name: is_eligible
        description: "Indicates whether the donor is eligible to donate blood."
        tests:
          - not_null
      
      - name: donor_location
        description: "The location of the donor at the time of donation."
        tests:
          - not_null
      
      - name: dbt_valid_from
        description: "The timestamp when the record became valid in the dimension."
        tests:
          - not_null
      
      - name: dbt_valid_to
        description: "The timestamp when the record is no longer valid in the dimension."
        
          