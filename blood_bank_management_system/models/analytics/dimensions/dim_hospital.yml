version: 2 

models:
  - name: dim_hospital
    description: "Dimension table for hospitals, containing details about each hospital."
    columns:
      - name: hospital_id 
        description: "Natural key for the hospital, typically the original ID from the source system"
        tests:
          - unique 
          - not_null

      - name: hospital_name
        description: "Name of the hospital"
        tests:
          - not_null

      - name: hospital_city
        description: "City where the hospital is located"
        tests:
          - not_null

      - name: hospital_country
        description: "Country where the hospital is located"
        tests:
          - not_null
        
      - name: hospital_phone_number
        description: "Contact phone number for the hospital"
        tests:
          - not_null

      - name: hospital_type
        description: "Type of the hospital (e.g., General, Specialty, etc.)"
        tests:
          - not_null

      - name: accreditation_status
        description: "Accreditation status of the hospital"
        tests:
          - not_null

