version: 2 

models: 
  - name: stg_donor_history 
    description: "Staging model for donor history data." 
    columns: 
      - name: history_id 
        description: "Unique identifier for each donor history record."
        tests: 
          - unique 
          - not_null
      
      - name: donor_id 
        description: "Unique identifier for each donor." 
        tests: 
          - not_null
      
      - name: donation_id
        description: "Unique identifier for each donation." 
        tests: 
          - unique 
          - not_null
      
      - name: reaction 
        description: "Reaction to the donation." 
        tests: 
          - not_null
          - accepted_values: 
              values: ['none', 'mild', 'severe']
      
      - name: ingested_at 
        description: "Timestamp of when the data was ingested." 
        tests: 
          - not_null