version: 2

models:
  - name: stg_donors
    description: "Standardized staging model for blood donors"

    columns:

      - name: donor_id
        description: "Unique identifier for each donor"
        tests:
          - not_null
          - unique

      - name: name
        description: "Full name of donor"
        tests:
          - not_null

      - name: age
        description: "Age of donor"
        tests:
          - not_null

      - name: gender
        description: "Gender of donor"
        tests:
          - not_null
          - accepted_values:
              values: ['Male', 'Female', 'Other']

      - name: blood_group
        description: "Blood group of donor"
        tests:
          - not_null
          - accepted_values:
              values: ['A+', 'A-', 'B+', 'B-', 'O+', 'O-', 'AB+', 'AB-']

      - name: is_eligible
        description: "Eligibility status"
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]

      - name: contact_method_type
        description: "Preferred contact method"
        tests:
          - not_null
          - accepted_values:
              values: ['phone', 'email']

      - name: donor_type
        description: "Type of donor"
        tests:
          - accepted_values:
              values: ['individual', 'corporation', 'anonymous']

      - name: donations_count
        description: "Total number of donations"
        tests:
          - not_null

      - name: ingested_at
        description: "Timestamp when record was loaded into raw layer"
        tests:
          - not_null