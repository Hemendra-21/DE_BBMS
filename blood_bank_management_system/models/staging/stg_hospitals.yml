version: 2

models:
  - name: stg_hospitals
    description: "Standardized staging model for hospitals"

    columns:

      - name: hospital_id
        description: "Primary key for hospital"
        tests:
          - not_null
          - unique

      - name: hospital_name
        description: "Hospital name"
        tests:
          - not_null

      - name: street_address
        description: "Street address"
        tests:
          - not_null

      - name: city
        description: "City where hospital is located"
        tests:
          - not_null

      - name: province
        description: "Province or state"
        tests:
          - not_null
          - accepted_values:
              values: ['Quebec']

      - name: country
        description: "Country of operation"
        tests:
          - not_null
          - accepted_values:
              values: ['Canada']

      - name: postal_code
        description: "Postal code of hospital"
        tests:
          - not_null

      - name: phone_number
        description: "Primary hospital contact number"
        tests:
          - not_null

      - name: email_address
        description: "Primary hospital email"
        tests:
          - not_null

      - name: hospital_type
        description: "Type of hospital"
        tests:
          - accepted_values:
              values: ['general', 'specialized', 'clinic']

      - name: accreditation_status
        description: "Accreditation status"
        tests:
          - accepted_values:
              values: ['accredited', 'certified']

      - name: ingested_at
        description: "Timestamp when record was loaded into raw layer"
        tests:
          - not_null